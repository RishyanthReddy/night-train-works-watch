# CC0 monthly running data; timezone is explicitly an assumption in config.py.
version: 1
dataset: infrabel_punctuality
licence: CC0
external_processing_allowed: true
file: {type: csv, encoding: utf-8, delimiter: ","}
timezone: Europe/Brussels
record: RunRow
complete: false
required: [service_date, train_no, point_id]
null_tokens: ["", "NULL"]
filter: {TRAIN_SERV: EURSLEEPER}
fields:
  service_date: {column: DATDEP, parse: "date:%d%b%Y"}
  train_no: {column: TRAIN_NO, parse: str, prefix: "be:"}
  point_id: {column: PTCAR_NO, parse: str, prefix: "be-ptcar:"}
  name: {column: PTCAR_LG_NM_NL, parse: str}
  line_dep: {column: LINE_NO_DEP, parse: str, prefix: "be:"}
  line_arr: {column: LINE_NO_ARR, parse: str, prefix: "be:"}
  planned_arr: {parse: "date_time:[PLANNED_DATE_ARR, PLANNED_TIME_ARR]", date_format: "%d%b%Y", time_format: "%H:%M:%S"}
  planned_dep: {parse: "date_time:[PLANNED_DATE_DEP, PLANNED_TIME_DEP]", date_format: "%d%b%Y", time_format: "%H:%M:%S"}
  real_arr: {parse: "date_time:[REAL_DATE_ARR, REAL_TIME_ARR]", date_format: "%d%b%Y", time_format: "%H:%M:%S"}
  real_dep: {parse: "date_time:[REAL_DATE_DEP, REAL_TIME_DEP]", date_format: "%d%b%Y", time_format: "%H:%M:%S"}
  delay_arr_s: {column: DELAY_ARR, parse: seconds}
  delay_dep_s: {column: DELAY_DEP, parse: seconds}
