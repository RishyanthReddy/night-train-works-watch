[project]
name = "nightdesk"
version = "0.1.0"
description = "Evidence-linked, adaptable railway operations intake and comparison tools"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2,<3",
    "pandas>=2,<4",
    "openpyxl>=3.1",
    "pyyaml>=6",
    "streamlit>=1.50,<2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
nightdesk = "nightdesk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
